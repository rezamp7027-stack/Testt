<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Admin | Rafsanjan Mafia</title><link rel="stylesheet" href="css/style.css?v=mafia"></head><body class="admin-page"><section id="login" class="login"><div><span class="kicker">RESTRICTED AREA</span><h1>RAFSANJAN<br>MAFIA</h1><form id="login-form"><label>ایمیل<input id="email" type="email" required></label><label>رمز عبور<input id="password" type="password" required></label><button class="btn primary full">ورود امن</button><p id="login-error" class="error"></p></form></div></section><div id="admin-app" hidden><header><div class="container adminbar"><b>RAFSANJAN MAFIA · ADMIN</b><div><a class="btn small" href="index.html">سایت</a><button id="logout" class="btn small">خروج</button></div></div></header><div class="container admin-layout"><aside class="tabs"><button class="active" data-tab="dashboard">داشبورد</button><button data-tab="events">ایونت‌ها</button><button data-tab="reservations">رزروها</button><button data-tab="seats">صندلی‌ها</button></aside><main><section id="dashboard" class="tab active"><div class="title"><h2>داشبورد</h2><button id="refresh" class="btn small">به‌روزرسانی</button></div><div id="stats" class="stats"></div><div id="recent" class="card"></div></section><section id="events" class="tab"><div class="title"><h2>ایونت‌ها</h2><button id="new-event" class="btn primary small">+ ایونت جدید</button></div><div id="events-list" class="card"></div></section><section id="reservations" class="tab"><div class="title"><h2>رزروها</h2></div><div class="toolbar"><input id="search" placeholder="نام، موبایل یا کد رزرو"><select id="filter"><option>ALL</option><option>PENDING</option><option>CONFIRMED</option><option>CANCELLED</option></select></div><div id="reservations-list" class="card table"></div></section><section id="seats" class="tab"><div class="title"><h2>مدیریت صندلی‌ها</h2><select id="seat-event"></select></div><div id="admin-seats" class="admin-seats"></div></section></main></div></div>
<dialog id="event-dialog"><form id="event-form"><button type="button" class="close" data-dialog>×</button><span class="kicker">EVENT CONFIGURATION</span><h2>ایونت</h2><input id="eid" type="hidden"><div class="form-grid"><label>نام انگلیسی<input id="etitle" required></label><label>نام فارسی<input id="efa" required></label><label>تاریخ<input id="edate" type="date"></label><label>ساعت<input id="etime" type="time"></label><label>مکان<input id="elocation" required></label><label>قیمت<input id="eprice" type="number" min="0"></label><label>ظرفیت<input id="ecapacity" type="number" min="1" max="100" value="10"></label><label>مدت دقیقه<input id="eduration" type="number" min="15" value="180"></label><label>وضعیت<select id="estatus"><option>DRAFT</option><option>PUBLISHED</option><option>CANCELLED</option><option>COMPLETED</option></select></label><label>لوگو<input id="elogo" value="assets/logo.png"></label><label class="wide">Banner URL<input id="ebanner" type="url"></label><label>تلفن<input id="ephone"></label><label>Instagram<input id="eig"></label><label>Telegram<input id="etg"></label><label class="wide">توضیحات<textarea id="edesc"></textarea></label></div><p id="event-error" class="error"></p><button class="btn primary full">ذخیره</button></form></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3"></script><script src="js/supabase.js"></script><script src="js/admin.js"></script></body></html>
