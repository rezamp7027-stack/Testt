<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Testt — Minimal Landing Page</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#171717;background:#f5f5f3}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center}
    main{width:min(920px,92vw);padding:64px 28px;background:#fff;border:1px solid #ddd;border-radius:24px;box-shadow:0 18px 60px #00000012}
    .tag{display:inline-block;padding:7px 11px;border-radius:999px;background:#eee;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
    h1{font-size:clamp(42px,8vw,78px);line-height:.95;margin:22px 0 18px;letter-spacing:-.055em}
    p{max-width:620px;color:#666;font-size:18px;line-height:1.65;margin:0 0 30px}
    button{border:0;border-radius:12px;padding:13px 18px;background:#171717;color:#fff;font-weight:700;cursor:pointer}
    button:hover{opacity:.85} #status{margin-top:18px;font-size:14px;color:#666;min-height:20px}
  </style>
</head>
<body>
  <main>
    <span class="tag">Testt</span>
    <h1>Simple. Clean. Functional.</h1>
    <p>A small, responsive HTML page built as a clean starting point for the Testt repository. No frameworks or external dependencies required.</p>
    <button id="action">Test interaction</button>
    <div id="status" aria-live="polite"></div>
  </main>
  <script>
    const button = document.querySelector("#action");
    const status = document.querySelector("#status");
    button.addEventListener("click", () => {
      status.textContent = "JavaScript is working correctly.";
    });
  </script>
</body>
</html>
